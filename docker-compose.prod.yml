# Log rotatsiyasi (log bandi): har konteyner uchun 20 MB x 5 fayl
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - protected_media_data:/app/protected_media
      - staticfiles_data:/app/staticfiles
      - logs_data:/app/logs
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/wait-for-db.sh"]
    command: celery -A config worker -l info --concurrency=2
    env_file: .env.docker
    volumes:
      - logs_data:/app/logs
    logging: *default-logging
    depends_on:
      - backend

  celery_beat:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/wait-for-db.sh"]
    command: celery -A config beat -l info
    env_file: .env.docker
    volumes:
      - logs_data:/app/logs
    logging: *default-logging
    depends_on:
      - backend

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - staticfiles_data:/staticfiles:ro
      - media_data:/media:ro
    logging: *default-logging
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  protected_media_data:
  staticfiles_data:
  logs_data:
  caddy_data:
  caddy_config:
